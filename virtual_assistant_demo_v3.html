<!doctype html><html lang="en"><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>Office Assistant Demo</title><style>body{font:16px -apple-system,Arial;background:#18202c;color:white;margin:0;padding:18px;text-align:center}.room{height:330px;position:relative;overflow:hidden;border-radius:18px;background:linear-gradient(#a3a8ac 0 70%,#796e62 70%)}.window{position:absolute;top:22px;left:20px;width:100px;height:135px;background:linear-gradient(#8dc5e7,#e3f2fa);border:9px solid white}.desk{position:absolute;bottom:20px;left:30%;width:65%;height:48px;background:#6b4932;border-radius:8px}.person{position:absolute;left:51%;bottom:70px;transition:left 1.4s,bottom .7s,transform .7s}.head{width:51px;height:62px;border-radius:50%;background:#edc5ae;margin:auto;box-shadow:0 -10px 0 5px #cda85f;animation:breathe 3s infinite}.body{width:77px;height:113px;background:#bd233b;clip-path:polygon(25% 0,75% 0,100% 100%,0 100%)}.sitting{bottom:37px;transform:scale(.83)}.standing{bottom:70px}.walking{left:14%;bottom:70px}@keyframes breathe{50%{transform:scale(1.035)}}button{border:0;border-radius:10px;padding:13px;background:#5277e5;color:white;margin:5px;font-size:16px}button:focus{outline:3px solid #f5d66d}button:active{background:#2d4aaf}input{border:0;border-radius:8px;padding:12px;width:60%;font-size:16px}#log{white-space:pre-wrap;text-align:left;background:#273242;padding:14px;border-radius:10px;margin-top:14px}</style><h2>Office Assistant Demo</h2><div class="room"><div class="window"></div><div id="person" class="person sitting"><div class="head"></div><div class="body"></div></div><div class="desk"></div></div><p id="status">Sitting at desk</p><button onclick="act('sitting')">Sit</button><button onclick="act('standing')">Stand</button><button onclick="act('walking')">Walk to window</button><div><input id="msg" placeholder="Type a message"><button onclick="send()">Send</button></div><div id="log">Assistant: Hello! Welcome to my office.</div><p style="font-size:12px;color:#c7c7c7">Early animation test. Live AI and voice are not connected.</p><script>function act(a){
 const person=document.getElementById('person');
 person.className='person '+a;
 const names={sitting:'Sit',standing:'Stand',walking:'Walk to window'};
 document.getElementById('status').textContent={sitting:'Sitting at desk',standing:'Standing',walking:'Walking to window'}[a];
 document.querySelectorAll('button').forEach(function(button){
   button.style.boxShadow=(button.textContent.trim()===names[a])?'inset 0 0 0 3px #ffe080':'';
 });
}
function send(){let v=document.getElementById('msg').value.trim();if(!v)return;let x=v.toLowerCase(),r='This is an animation test. Live AI conversation is not connected yet.';if(/stand|get up/.test(x)){act('standing');r='Sure, I will stand up.'}else if(/sit|seat/.test(x)){act('sitting');r='I will sit down.'}else if(/walk|window/.test(x)){act('walking');r='I will walk to the window.'}else if(/hi|hello|hey/.test(x))r='Hello! Welcome to my office.';document.getElementById('log').textContent='You: '+v+'\nAssistant: '+r;document.getElementById('msg').value=''}document.getElementById('msg').addEventListener('keydown',e=>{if(e.key==='Enter')send()})</script></html>
