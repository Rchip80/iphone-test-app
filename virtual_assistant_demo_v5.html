und:#111b29e8;text-align:center;z-index:6;display:none}.hint{position:absolute;left:2%;top:2%;font-size:12px;background:#101824d9;padding:8px;border-radius:8px;max-width:42%;z-index:5}.credit{position:absolute;bottom:12%;left:2%;font-size:11px;color:#fff9;background:#0006;padding:4px 7px;border-radius:7px;z-index:5}

</style></head><body><div class="stage"><div class="world"><div class="background"></div><div class="actor standing" id="actor"><div class="figure"></div></div></div><div class="hint">V5 motion prototype · 2D articulated motion test, not photorealistic 3D</div><div class="panel"><button onclick="act('stand',this)">Stand</button><button onclick="act('sit',this)">Sit</button><button onclick="act('walk to window',this)">Walk to Window</button><button onclick="act('return to desk',this)">Return to Desk</button></div><div class="toast" id="toast" role="status"></div><div class="credit">Motion test: walking and sitting are approximations</div><form class="bottom" onsubmit="submitCommand(event)"><input id="cmd" placeholder="Type sit, stand, walk to window..." aria-label="Command"><button aria-label="Send">➤</button></form></div><script>
const actor=document.getElementById('actor'),toast=document.getElementById('toast');let timer,moveTimer,seq=0;const start={left:48.014,bottom:0.000};function message(s){toast.textContent=s;toast.style.display='block';clearTimeout(timer);timer=setTimeout(()=>toast.style.display='none',3000)}function act(command,button){seq++;const n=seq;clearTimeout(moveTimer);document.querySelectorAll('.panel button').forEach(x=>x.classList.remove('active'));if(button)button.classList.add('active');if(command==='stand'){actor.className='actor standing';message('Standing.')}else if(command==='sit'){actor.className='actor sitting';message('Sitting motion preview.')}else if(command==='walk to window'||command==='return to desk'){actor.className='actor walking';const windowSide=command==='walk to window';actor.style.left=(windowSide?77:start.left)+'%';actor.style.bottom=(windowSide?start.bottom+1:start.bottom)+'%';message(windowSide?'Walking toward the window...':'Returning to the desk...');moveTimer=setTimeout(()=>{if(n!==seq)return;actor.className='actor standing';message(windowSide?'At the window.':'Back at the desk.')},3000)}else{message('Try stand, sit, walk to window, or return to desk.')}}function submitCommand(e){e.preventDefault();const c=document.getElementById('cmd');const s=c.value.trim().toLowerCase();if(!s)return;const opts=['stand','sit','walk to window','return to desk'];const i=opts.findIndex(x=>s.includes(x));act(i>=0?opts[i]:s,i>=0?document.querySelectorAll('.panel button')[i]:null);c.value=''}
</script></body></html>
