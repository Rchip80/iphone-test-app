 ease-in-out infinite alternate}.person.at-window{transform:translateX(34vw) scale(.70) rotate(-5deg)}.person.at-desk{transform:translateX(-65vw) scale(.84)}.person.sitting{transform:translateX(-62%) translateY(18%) rotate(-12deg) scaleY(.80)}@keyframes steps{from{transform:translateX(var(--walk-x)) translateY(0) rotate(-2deg) scale(var(--walk-scale))}to{transform:translateX(var(--walk-x)) translateY(-11px) rotate(2deg) scale(var(--walk-scale))}}.head{position:absolute;top:14px;left:14px;z-index:3;background:#131a27dd;border:1px solid #ffffff55;border-radius:13px;padding:10px 12px;font-size:13px}.head strong{display:block;font-size:17px}.controls{position:absolute;z-index:3;right:12px;top:16%;width:min(170px,37vw);display:grid;gap:9px}.controls button,.send{color:#fff;background:#1d293be8;border:1px solid #c2c7d5;border-radius:16px;padding:13px 7px;font-size:14px;min-height:51px}.controls button:active,.controls button.active{background:#11667e}.bottom{position:absolute;z-index:4;bottom:calc(18px + env(safe-area-inset-bottom));left:12px;right:12px;display:flex;gap:8px}.bottom input{min-width:0;flex:1;padding:13px;border-radius:15px;border:1px solid #bbc2cc;background:#152034ef;color:#fff;font-size:16px}.send{min-width:53px}.status{position:absolute;z-index:4;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);max-width:60%;text-align:center;background:#132b36ee;border-radius:10px;padding:7px 10px;font-size:12px;display:none}@media(min-aspect-ratio:1/1){.person{height:100%;}.controls{width:220px;right:2%;top:18%}}
</style></head><body><main class="stage"><div class="office"></div><div class="person" id="person" aria-label="Woman in red dress"></div><div class="head"><strong>Virtual Assistant V7</strong>Animated character prototype</div><div class="controls"><button data-c="stand">Stand</button><button data-c="sit">Sit</button><button data-c="window">Walk to Window</button><button data-c="desk">Return to Desk</button></div><div class="status" id="status"></div><form class="bottom" id="form"><input id="command" placeholder="Type a command..." aria-label="Command"><button class="send">➤</button></form></main><script>
const person=document.getElementById('person'),status=document.getElementById('status'),buttons=[...document.querySelectorAll('[data-c]')];let travel=0,current='stand',atWindow=false;
function say(s){status.textContent=s;status.style.display='block';clearTimeout(say.t);say.t=setTimeout(()=>status.style.display='none',2400)}
function command(action){clearTimeout(travel);buttons.forEach(b=>b.classList.toggle('active',b.dataset.c===action));person.className='person';current=action;
if(action==='stand'){say('Standing');person.style.transform='translateX(-50%)';return}
if(action==='sit'){say('Sitting (prototype pose)');person.classList.add('sitting');person.style.transform='';return}
if(action==='window'||action==='desk'){
const dest=action==='window'?'34vw':'-65vw';const sc=action==='window'?.70:.84;
person.style.setProperty('--walk-x',dest);person.style.setProperty('--walk-scale',sc);person.style.transform='';person.classList.add('walking');say(action==='window'?'Walking to window':'Returning to desk');
travel=setTimeout(()=>{person.classList.remove('walking');person.classList.add(action==='window'?'at-window':'at-desk');say(action==='window'?'At window':'At desk')},1500);return}
}
buttons.forEach(b=>b.addEventListener('click',()=>command(b.dataset.c)));
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();let s=document.getElementById('command').value.toLowerCase();document.getElementById('command').value='';if(/window/.test(s))command('window');else if(/desk|return|back/.test(s))command('desk');else if(/sit/.test(s))command('sit');else if(/stand/.test(s))command('stand');else say('Try stand, sit, window, or desk')});
</script></body></html>
